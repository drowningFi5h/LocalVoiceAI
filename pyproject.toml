[project]
name = "localvoiceai"
version = "0.1.0"
description = "An inspectable, local-first voice RAG laboratory"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1",
  "aiosqlite>=0.21,<1",
  "langchain-core>=1,<2",
  "langchain-text-splitters>=1,<2",
  "langchain-ollama>=1,<2",
  "langchain-openai>=1,<2",
  "langchain-qdrant>=1,<2",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "fastembed>=0.7,<1",
  "qdrant-client>=1.14,<2",
  "pypdf>=5,<7",
  "trafilatura>=2,<3",
  "tiktoken>=0.9,<1",
  "numpy>=1.26,<3",
  "langchain-google-genai>=4.4.0",
]

[project.optional-dependencies]
voice = ["faster-whisper>=1.1,<2", "silero-vad>=6,<7", "kokoro>=0.9,<1", "soundfile>=0.13,<1",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/localvoiceai"]

[tool.hatch.metadata]
allow-direct-references = true
